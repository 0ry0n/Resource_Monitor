name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging tools and Shexli
        run: |
          sudo apt-get update && sudo apt-get install -y zip gettext
          python -m pip install --upgrade --index-url https://pypi.org/simple shexli

      - name: Check release ZIP with Shexli
        run: make validate
